[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto_trading"
version = "0.1.0"
description = "Modular intraday crypto trading research scaffold (CCXT)."
requires-python = ">=3.11"
dependencies = ["ccxt>=4.2,<5", "pandas>=2.1,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
crypto-trading = "crypto_trading.main:main"

[tool.setuptools]
packages = ["crypto_trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
